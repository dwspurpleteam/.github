name: deploy

on:
  workflow_call:
    inputs:
      service:
        required: false
        default: ""
        type: string
      artifact:
        type: string
        default: ""
      artifact-path:
        type: string
        default: ""
      dockerfile:
        type: string
        default: "Dockerfile"
      context:
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: artifact
        if: inputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.artifact-path }}

      - name: build
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
        run: make image-build

      - name: push
        run: make image-push

      - name: deploy
        if: inputs.service != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOYER_TOKEN }}
          SERVICE: ${{ inputs.service }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: gh api repos/dwspurpleteam/deployer/dispatches -f event_type=image -f "client_payload[service]=$SERVICE" -f "client_payload[sha]=$SHA" -f "client_payload[repository]=$REPOSITORY"
