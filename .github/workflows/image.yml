name: image

on:
  workflow_call:
    inputs:
      service:
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        run: make image-build

      - name: push
        run: make image-push

      - name: deploy
        if: inputs.service != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOYER_TOKEN }}
          SERVICE: ${{ inputs.service }}
          SHA: ${{ github.sha }}
        run: gh api repos/dwspurpleteam/deployer/dispatches -f event_type=image -f "client_payload[service]=$SERVICE" -f "client_payload[sha]=$SHA"
